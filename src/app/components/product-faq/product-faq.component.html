<section class="product-faq" aria-labelledby="product-faq-heading">
  <h2 id="product-faq-heading">{{ heading }}</h2>
  <div class="faq-list">
    @for (item of items; track item.question) {
      <details class="faq-item">
        <summary>{{ item.question }}</summary>
        <div class="answer"><p>{{ item.answer }}</p></div>
      </details>
    }
  </div>
  <p class="more">
    Have a question about files, turnaround or delivery? See the <a routerLink="/faq">full FAQ</a>
    or call <a href="tel:6195001959">619-500-1959</a>.
  </p>
</section>
